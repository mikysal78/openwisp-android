name: Release

# Al push di un tag v* (es. v0.2.0): test, APK e AAB firmati, controllo della
# firma, SHA256SUMS, attestazione di provenienza e release su GitHub con le
# note del CHANGELOG.
#
# I secret stanno nell'environment "release", usabile solo dai tag v*:
#   OW_KEYSTORE_BASE64   keystore PKCS12 in base64
#   OW_KEYSTORE_PASSWORD, OW_KEY_ALIAS, OW_KEY_PASSWORD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # impronta SHA-256 del certificato di firma: una release firmata con
      # un'altra chiave non si installerebbe sopra le precedenti
      SIGNING_CERT_SHA256: d2880d23b5758a4b6057bfb4d28f0edf36cd810a972d5e586529c6b5a3164dfe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Version matches the tag
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "::error::versionName $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          OW_KEYSTORE_BASE64: ${{ secrets.OW_KEYSTORE_BASE64 }}
        run: |
          [ -n "$OW_KEYSTORE_BASE64" ] || { echo "::error::secret OW_KEYSTORE_BASE64 missing"; exit 1; }
          umask 077
          echo "$OW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests, lint, signed APK and AAB
        env:
          OW_KEYSTORE_PASSWORD: ${{ secrets.OW_KEYSTORE_PASSWORD }}
          OW_KEY_ALIAS: ${{ secrets.OW_KEY_ALIAS }}
          OW_KEY_PASSWORD: ${{ secrets.OW_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease --console=plain

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the signature and collect the files
        run: |
          set -o pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/openwisp-android-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/openwisp-android-$VERSION.aab"
          digest=$("$apksigner" verify --print-certs "dist/openwisp-android-$VERSION.apk" \
            | grep -m1 "certificate SHA-256 digest: " | sed 's/.*certificate SHA-256 digest: //')
          # apksigner 36 scrive "Signer #1 certificate ...", il 37 "V2 Signer: certificate ..."
          [ "$digest" = "$SIGNING_CERT_SHA256" ] || {
            echo "::error::APK signed with an unexpected certificate: $digest"; exit 1; }
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/openwisp-android-*

      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          **Install**: download \`openwisp-android-$VERSION.apk\` and open it on the phone (Android 8.0+).
          Signing certificate SHA-256: \`$SIGNING_CERT_SHA256\`
          (\`apksigner verify --print-certs\`); checksums in \`SHA256SUMS\`, build provenance attested by GitHub
          (\`gh attestation verify openwisp-android-$VERSION.apk -R $GITHUB_REPOSITORY\`).
          The \`.aab\` bundle is for Google Play.
          NOTES

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "openwisp-android $VERSION" \
            --notes-file notes.md dist/*
