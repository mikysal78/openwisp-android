name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Android lint
        run: ./gradlew lintDebug --console=plain
      - name: Debug APK
        run: ./gradlew assembleDebug --console=plain
      - name: apksigner reads the signature
        run: |
          set -o pipefail
          ls "$ANDROID_HOME/build-tools"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -q "certificate SHA-256 digest: " certs.txt
      - uses: actions/upload-artifact@v7
        with:
          name: openwisp-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
